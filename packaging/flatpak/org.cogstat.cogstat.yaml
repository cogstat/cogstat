app-id: org.cogstat.cogstat
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: cogstat

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --env=R_HOME=/app/lib/R
  - --env=LD_LIBRARY_PATH=/app/lib:/app/lib/R/lib

build-options:
  build-args:
    - --share=network
  env:
    PYTHONPATH: /app/lib/python3.12/site-packages
    R_HOME: /app/lib/R
    LD_LIBRARY_PATH: /app/lib:/app/lib/R/lib

modules:
  - name: r-base
    buildsystem: autotools
    config-opts:
      - --prefix=/app
      - --libdir=/app/lib
      - --enable-R-shlib
      - --with-blas
      - --with-lapack
      - --with-readline=no
      - --with-x=no
    sources:
      - type: archive
        url: https://cran.r-project.org/src/base/R-4/R-4.4.2.tar.gz
        sha256: 1578cd603e8d866b58743e49d8bf99c569e81079b6a60cf33cdf7bdffeb817ec

  - name: r-packages
    buildsystem: simple
    build-commands:
      - Rscript -e "install.packages(c('car', 'ez'), repos='https://cloud.r-project.org')"

  - name: cogstat
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app cffi
      - pip3 install --prefix=/app --no-build-isolation --no-binary rpy2 ".[GUI]"
      - install -Dm644 packaging/flatpak/org.cogstat.cogstat.desktop /app/share/applications/org.cogstat.cogstat.desktop
      - install -Dm644 packaging/flatpak/org.cogstat.cogstat.metainfo.xml /app/share/metainfo/org.cogstat.cogstat.metainfo.xml
      - install -Dm644 "cogstat/resources/CogStat icon.svg" /app/share/icons/hicolor/scalable/apps/org.cogstat.cogstat.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - cogstat.egg-info