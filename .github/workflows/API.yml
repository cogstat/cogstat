name: Deploy API Docs

on:
  push:
    branches: [master, devel]
    paths:
      - 'cogstat/**'
      - '.github/workflows/API.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set RPY2 environment variable
        run: echo "RPY2_CFFI_MODE=ABI" >> $GITHUB_ENV

      - name: Install package dependencies
        run: pip install -e .

      - name: Install pdoc
        run: pip install 'pdoc==13.*'

      - name: Build documentation
        run: pdoc -o ./docs/html cogstat/cogstat.py -d numpy --no-show-source --logo 'https://raw.githubusercontent.com/cogstat/cogstat/refs/heads/devel/cogstat/resources/CogStat%20icon.svg'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4